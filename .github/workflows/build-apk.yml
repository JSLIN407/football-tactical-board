name: Build & Publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run build:mobile
          npx cap sync android

      - name: Generate Android signing key & build AI + Pure Fullscreen APKs
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias tactical \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tactical123 \
            -keypass tactical123 \
            -dname "CN=AITacticalBoard, OU=Mobile, O=TacticalBoard, L=Taipei, S=Taiwan, C=TW"
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

          # 1) Build Standard AI Tactical Board APK (app.tacticalboard.football)
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk AI-Football-Tactical-Board-v1.2.0.apk

          # 2) Build Full-Screen Pure Tactical Board APK (app.tacticalboard.football.pure)
          cp dist/pure.html android/app/src/main/assets/public/index.html
          sed -i 's/AI戰術板/戰術板純享/g; s/app\.tacticalboard\.football/app.tacticalboard.football.pure/g' android/app/src/main/res/values/strings.xml
          (cd android && ./gradlew assembleRelease -PpureEdition=true --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk Football-Tactical-Board-Pure-v1.2.0.apk

      - name: Upload APKs & Mobile Bundles to GitHub Release v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "release/足球戰術板_手機純享版.html" Football-Tactical-Board-Pure-v1.2.0.html
          zip -r Football-Tactical-Board-Pure-v1.2.0.zip "release/足球戰術板_手機純享版.html" dist/pure.html dist/manifest-pure.webmanifest dist/sw.js dist/assets dist/icons
          cp "release/AI足球戰術板_手機隨身版.html" AI-Football-Tactical-Board-Standalone-v1.2.0.html
          zip -r AI-Football-Tactical-Board-Mobile-v1.2.0.zip release/ dist/
          if ! gh release view v1.2.0 >/dev/null 2>&1; then
            gh release create v1.2.0 --title "足球戰術板 v1.2.0（新增全螢幕手機純享版 + AI 推演版）" --notes "同時提供【僅有戰術板全螢幕手機純享版 APK / HTML / ZIP】與【AI 空間戰術推演版 APK / HTML】，兩款 APK 套件 ID 獨立，可單獨或同時安裝於手機。"
          fi
          gh release upload v1.2.0 \
            Football-Tactical-Board-Pure-v1.2.0.apk \
            Football-Tactical-Board-Pure-v1.2.0.html \
            Football-Tactical-Board-Pure-v1.2.0.zip \
            AI-Football-Tactical-Board-v1.2.0.apk \
            AI-Football-Tactical-Board-Mobile-v1.2.0.zip \
            AI-Football-Tactical-Board-Standalone-v1.2.0.html \
            --clobber
